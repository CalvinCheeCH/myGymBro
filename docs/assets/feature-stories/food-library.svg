<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">One label. A reference you keep using.</title><desc id="desc">Three scripted steps: save a label with 120 calories and 24 grams protein per 30 gram serving; keep a Food Library record with a Label source; reuse 1.5 servings as 180 calories and 36 grams protein.</desc><g font-family="Segoe UI,Arial,sans-serif"><rect width="1200" height="760" rx="22" fill="#f8f9f3"/><text x="40" y="43" font-size="14" font-weight="700" fill="#6d7c5c">MYGYMBRO / FEATURE WALKTHROUGH</text><text x="40" y="91" font-size="34" font-weight="750" fill="#23291e">One label. A reference you keep using.</text><text x="40" y="128" font-size="19" font-weight="400" fill="#425038">Save the serving once. Reuse its values when the same food returns.</text><rect x="40" y="162" width="360" height="504" rx="16" fill="#fff" stroke="#dce3d3"/><rect x="62" y="184" width="35" height="31" rx="8" fill="#d0f879" stroke="#d0f879"/><text x="72" y="206" font-size="17" font-weight="700" fill="#425038">1</text><text x="110" y="207" font-size="22" font-weight="700" fill="#425038">Save the label</text><rect x="62" y="235" width="316" height="56" rx="16" fill="#e3f4c8" stroke="#dce3d3"/><text x="78" y="266" font-size="18" font-weight="400" fill="#425038">Remember this Sample whey.</text><rect x="62" y="313" width="316" height="223" rx="16" fill="#f1f5e9" stroke="#dce3d3"/><text x="79" y="344" font-size="13" font-weight="700" fill="#425038">SAMPLE NUTRITION LABEL</text><text x="79" y="377" font-size="15" font-weight="400" fill="#6d7962">Printed serving</text><text x="79" y="406" font-size="21" font-weight="650" fill="#425038">1 serving · 30 g</text><text x="79" y="449" font-size="15" font-weight="400" fill="#6d7962">Calories / protein</text><text x="79" y="478" font-size="21" font-weight="650" fill="#425038">120 kcal / 24 g</text><text x="62" y="577" font-size="17" font-weight="400" fill="#425038">Saving a label adds a reference.</text><text x="62" y="603" font-size="17" font-weight="400" fill="#425038">Log eating it as a separate step.</text><rect x="420" y="162" width="360" height="504" rx="16" fill="#fff" stroke="#dce3d3"/><rect x="442" y="184" width="35" height="31" rx="8" fill="#d0f879" stroke="#d0f879"/><text x="452" y="206" font-size="17" font-weight="700" fill="#425038">2</text><text x="490" y="207" font-size="22" font-weight="700" fill="#425038">Keep the reference</text><rect x="442" y="235" width="316" height="326" rx="16" fill="#fff" stroke="#dce3d3"/><text x="458" y="270" font-size="14" font-weight="700" fill="#425038">NOTION / FOOD LIBRARY</text><text x="458" y="307" font-size="15" font-weight="400" fill="#6d7962">Name / category</text><text x="458" y="336" font-size="21" font-weight="650" fill="#425038">Sample whey / Supplements</text><text x="458" y="380" font-size="15" font-weight="400" fill="#6d7962">Serving</text><text x="458" y="409" font-size="21" font-weight="650" fill="#425038">1 serving · 30 g</text><text x="458" y="454" font-size="15" font-weight="400" fill="#6d7962">Saved values</text><text x="458" y="483" font-size="21" font-weight="650" fill="#425038">120 kcal / 24 g protein</text><text x="458" y="536" font-size="16" font-weight="600" fill="#587836">Source: Label</text><text x="442" y="604" font-size="17" font-weight="400" fill="#425038">A saved estimate stays an estimate.</text><text x="442" y="630" font-size="17" font-weight="400" fill="#425038">Correct it when you have better data.</text><rect x="800" y="162" width="360" height="504" rx="16" fill="#fff" stroke="#dce3d3"/><rect x="822" y="184" width="35" height="31" rx="8" fill="#d0f879" stroke="#d0f879"/><text x="832" y="206" font-size="17" font-weight="700" fill="#425038">3</text><text x="870" y="207" font-size="22" font-weight="700" fill="#425038">Reuse next time</text><rect x="822" y="235" width="316" height="84" rx="16" fill="#e3f4c8" stroke="#dce3d3"/><text x="838" y="266" font-size="18" font-weight="400" fill="#425038">I had 1.5 servings of the</text><text x="838" y="294" font-size="18" font-weight="400" fill="#425038">same Sample whey.</text><rect x="822" y="343" width="316" height="84" rx="16" fill="#ffffff" stroke="#dce3d3"/><text x="838" y="374" font-size="18" font-weight="400" fill="#425038">Using the saved label values:</text><text x="838" y="402" font-size="18" font-weight="400" fill="#425038">180 kcal · 36 g protein.</text><rect x="822" y="457" width="316" height="104" rx="16" fill="#f1f5e9" stroke="#dce3d3"/><text x="838" y="490" font-size="21" font-weight="650" fill="#425038">1.5 × 120 = 180 kcal</text><text x="838" y="527" font-size="21" font-weight="650" fill="#425038">1.5 × 24 = 36 g protein</text><text x="822" y="604" font-size="17" font-weight="400" fill="#425038">The connected workflow can log this</text><text x="822" y="630" font-size="17" font-weight="400" fill="#425038">in today’s Meal Log.</text><text x="40" y="710" font-size="13" font-weight="650" fill="#6d7c5c">SCRIPTED EXAMPLE · FICTIONAL DATA · CONNECTED NOTION REQUIRED TO SAVE RECORDS</text><text x="40" y="739" font-size="14" font-weight="400" fill="#6d7c5c">Illustrative product flow. Messages and values shown are examples, not a live integration.</text></g></svg>