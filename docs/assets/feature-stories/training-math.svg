<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Use recorded numbers for the next decision.</title><desc id="desc">A scripted top set of 60 kilograms for 6 reps illustrates a hold under a five-to-eight-rep double progression rule; Epley gives an estimated 72 kilogram one-rep max; 62.5 kilograms total needs a twenty kilogram bar plus twenty and one-quarter kilograms per side.</desc><g font-family="Segoe UI,Arial,sans-serif"><rect width="1200" height="760" rx="22" fill="#f8f9f3"/><text x="40" y="43" font-size="14" font-weight="700" fill="#6d7c5c">MYGYMBRO / FEATURE WALKTHROUGH</text><text x="40" y="91" font-size="34" font-weight="750" fill="#23291e">Use recorded numbers for the next decision.</text><text x="40" y="128" font-size="19" font-weight="400" fill="#425038">Rule-based suggestions and practical arithmetic support the coaching conversation.</text><rect x="40" y="162" width="360" height="504" rx="16" fill="#fff" stroke="#dce3d3"/><rect x="62" y="184" width="35" height="31" rx="8" fill="#d0f879" stroke="#d0f879"/><text x="72" y="206" font-size="17" font-weight="700" fill="#425038">1</text><text x="110" y="207" font-size="22" font-weight="700" fill="#425038">Start from your log</text><rect x="62" y="235" width="316" height="236" rx="16" fill="#fff" stroke="#dce3d3"/><text x="78" y="270" font-size="14" font-weight="700" fill="#425038">SAMPLE RECORDED TOP SET</text><text x="78" y="326" font-size="30" font-weight="750" fill="#425038">60 kg × 6 reps</text><text x="78" y="380" font-size="15" font-weight="400" fill="#6d7962">Example rep range</text><text x="78" y="409" font-size="21" font-weight="650" fill="#425038">5–8 reps</text><text x="62" y="523" font-size="18" font-weight="400" fill="#425038">The helper reads recorded exercises</text><text x="62" y="552" font-size="18" font-weight="400" fill="#425038">and established variations.</text><text x="62" y="581" font-size="18" font-weight="400" fill="#425038">Your program sets the context.</text><rect x="420" y="162" width="360" height="504" rx="16" fill="#fff" stroke="#dce3d3"/><rect x="442" y="184" width="35" height="31" rx="8" fill="#d0f879" stroke="#d0f879"/><text x="452" y="206" font-size="17" font-weight="700" fill="#425038">2</text><text x="490" y="207" font-size="22" font-weight="700" fill="#425038">See the rule</text><rect x="442" y="235" width="316" height="236" rx="16" fill="#f1f5e9" stroke="#dce3d3"/><text x="458" y="270" font-size="13" font-weight="700" fill="#425038">DOUBLE-PROGRESSION EXAMPLE</text><text x="458" y="326" font-size="30" font-weight="750" fill="#425038">Hold 60 kg</text><text x="458" y="368" font-size="18" font-weight="400" fill="#425038">6 reps sits inside the 5–8 range.</text><text x="458" y="397" font-size="18" font-weight="400" fill="#425038">The rule keeps the load until</text><text x="458" y="426" font-size="18" font-weight="400" fill="#425038">the required target is met.</text><text x="442" y="523" font-size="18" font-weight="400" fill="#425038">The tool can explain an increase,</text><text x="442" y="552" font-size="18" font-weight="400" fill="#425038">hold, or deload suggestion.</text><text x="442" y="581" font-size="18" font-weight="400" fill="#425038">It is not a guarantee of progress.</text><rect x="800" y="162" width="360" height="504" rx="16" fill="#fff" stroke="#dce3d3"/><rect x="822" y="184" width="35" height="31" rx="8" fill="#d0f879" stroke="#d0f879"/><text x="832" y="206" font-size="17" font-weight="700" fill="#425038">3</text><text x="870" y="207" font-size="22" font-weight="700" fill="#425038">Check the arithmetic</text><rect x="822" y="235" width="316" height="169" rx="16" fill="#fff" stroke="#dce3d3"/><text x="838" y="272" font-size="15" font-weight="400" fill="#6d7962">Estimated 1RM for 60 kg × 6</text><text x="838" y="301" font-size="21" font-weight="650" fill="#425038">72 kg · Epley estimate</text><text x="838" y="354" font-size="16" font-weight="400" fill="#425038">An estimate, not a tested max.</text><rect x="822" y="426" width="316" height="162" rx="16" fill="#f1f5e9" stroke="#dce3d3"/><text x="838" y="461" font-size="15" font-weight="400" fill="#6d7962">If you choose a 62.5 kg total</text><text x="838" y="490" font-size="21" font-weight="650" fill="#425038">20 kg bar + 21.25 kg per side</text><text x="838" y="545" font-size="19" font-weight="650" fill="#425038">Per side: 20 kg + 1.25 kg</text><text x="822" y="629" font-size="17" font-weight="400" fill="#425038">Choose loads with your program.</text><text x="40" y="710" font-size="13" font-weight="650" fill="#6d7c5c">SCRIPTED EXAMPLE · FICTIONAL DATA · CONNECTED NOTION REQUIRED TO SAVE RECORDS</text><text x="40" y="739" font-size="14" font-weight="400" fill="#6d7c5c">Illustrative product flow. Messages and values shown are examples, not a live integration.</text></g></svg>