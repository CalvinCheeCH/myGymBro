<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Turn recorded training into a clearer review.</title><desc id="desc">Weekly and monthly report commands produce calculated training summaries; a separate progress command asks for an AI-written interpretation. All chart values are fictional.</desc><g font-family="Segoe UI,Arial,sans-serif"><rect width="1200" height="760" rx="22" fill="#f8f9f3"/><text x="40" y="43" font-size="14" font-weight="700" fill="#6d7c5c">MYGYMBRO / FEATURE WALKTHROUGH</text><text x="40" y="91" font-size="34" font-weight="750" fill="#23291e">Turn recorded training into a clearer review.</text><text x="40" y="128" font-size="19" font-weight="400" fill="#425038">Two time horizons. Training comparisons grounded in logged records.</text><rect x="40" y="162" width="360" height="504" rx="16" fill="#fff" stroke="#dce3d3"/><rect x="62" y="184" width="35" height="31" rx="8" fill="#d0f879" stroke="#d0f879"/><text x="72" y="206" font-size="17" font-weight="700" fill="#425038">1</text><text x="110" y="207" font-size="22" font-weight="700" fill="#425038">Review the week</text><rect x="62" y="235" width="316" height="56" rx="16" fill="#e3f4c8" stroke="#dce3d3"/><text x="78" y="266" font-size="18" font-weight="400" fill="#425038">/report</text><text x="62" y="342" font-size="14" font-weight="700" fill="#425038">SAMPLE WORKING SETS</text><rect x="69" y="430" width="14" height="54" rx="3" fill="#dfe8d2" stroke="#dfe8d2"/><rect x="86" y="412" width="14" height="72" rx="3" fill="#9cbd6c" stroke="#9cbd6c"/><rect x="116" y="403" width="14" height="81" rx="3" fill="#dfe8d2" stroke="#dfe8d2"/><rect x="133" y="394" width="14" height="90" rx="3" fill="#9cbd6c" stroke="#9cbd6c"/><rect x="163" y="439" width="14" height="45" rx="3" fill="#dfe8d2" stroke="#dfe8d2"/><rect x="180" y="430" width="14" height="54" rx="3" fill="#9cbd6c" stroke="#9cbd6c"/><rect x="210" y="448" width="14" height="36" rx="3" fill="#dfe8d2" stroke="#dfe8d2"/><rect x="227" y="439" width="14" height="45" rx="3" fill="#9cbd6c" stroke="#9cbd6c"/><rect x="257" y="439" width="14" height="45" rx="3" fill="#dfe8d2" stroke="#dfe8d2"/><rect x="274" y="421" width="14" height="63" rx="3" fill="#9cbd6c" stroke="#9cbd6c"/><rect x="304" y="457" width="14" height="27" rx="3" fill="#dfe8d2" stroke="#dfe8d2"/><rect x="321" y="448" width="14" height="36" rx="3" fill="#9cbd6c" stroke="#9cbd6c"/><text x="69" y="512" font-size="12" font-weight="400" fill="#425038">Chest · Back · Legs · Shoulders · Biceps · Triceps</text><text x="62" y="551" font-size="17" font-weight="400" fill="#425038">See recorded training days, duration,</text><text x="62" y="578" font-size="17" font-weight="400" fill="#425038">and muscle-group set totals.</text><text x="62" y="605" font-size="17" font-weight="400" fill="#425038">Compare the same elapsed days</text><text x="62" y="632" font-size="17" font-weight="400" fill="#425038">with the previous week.</text><rect x="420" y="162" width="360" height="504" rx="16" fill="#fff" stroke="#dce3d3"/><rect x="442" y="184" width="35" height="31" rx="8" fill="#d0f879" stroke="#d0f879"/><text x="452" y="206" font-size="17" font-weight="700" fill="#425038">2</text><text x="490" y="207" font-size="22" font-weight="700" fill="#425038">Change the horizon</text><rect x="442" y="235" width="316" height="56" rx="16" fill="#e3f4c8" stroke="#dce3d3"/><text x="458" y="266" font-size="18" font-weight="400" fill="#425038">/report monthly</text><rect x="442" y="335" width="316" height="197" rx="16" fill="#f1f5e9" stroke="#dce3d3"/><text x="458" y="372" font-size="14" font-weight="700" fill="#425038">COMPLETED MONTHS</text><text x="458" y="409" font-size="15" font-weight="400" fill="#6d7962">Compare</text><text x="458" y="438" font-size="21" font-weight="650" fill="#425038">Latest month / month before</text><text x="458" y="486" font-size="15" font-weight="600" fill="#425038">Average weekly muscle-group sets</text><text x="442" y="577" font-size="17" font-weight="400" fill="#425038">Monthly totals are normalized by</text><text x="442" y="604" font-size="17" font-weight="400" fill="#425038">calendar days for a fairer view.</text><rect x="800" y="162" width="360" height="504" rx="16" fill="#fff" stroke="#dce3d3"/><rect x="822" y="184" width="35" height="31" rx="8" fill="#d0f879" stroke="#d0f879"/><text x="832" y="206" font-size="17" font-weight="700" fill="#425038">3</text><text x="870" y="207" font-size="22" font-weight="700" fill="#425038">Ask what it means</text><rect x="822" y="235" width="316" height="56" rx="16" fill="#e3f4c8" stroke="#dce3d3"/><text x="838" y="266" font-size="18" font-weight="400" fill="#425038">/progress</text><rect x="822" y="320" width="316" height="84" rx="16" fill="#ffffff" stroke="#dce3d3"/><text x="838" y="351" font-size="18" font-weight="400" fill="#425038">Ask for a written review of</text><text x="838" y="379" font-size="18" font-weight="400" fill="#425038">your available training history.</text><rect x="822" y="455" width="316" height="132" rx="16" fill="#f1f5e9" stroke="#dce3d3"/><text x="838" y="488" font-size="18" font-weight="400" fill="#425038">Report cards use calculations.</text><text x="838" y="518" font-size="18" font-weight="400" fill="#425038">Written coaching uses AI.</text><text x="838" y="548" font-size="18" font-weight="400" fill="#425038">Duration appears when recorded.</text><text x="822" y="630" font-size="16" font-weight="400" fill="#425038">Chart rendering uses QuickChart.</text><text x="40" y="710" font-size="13" font-weight="650" fill="#6d7c5c">SCRIPTED EXAMPLE · FICTIONAL DATA · CONNECTED NOTION REQUIRED TO SAVE RECORDS</text><text x="40" y="739" font-size="14" font-weight="400" fill="#6d7c5c">Illustrative product flow. Messages and values shown are examples, not a live integration.</text></g></svg>