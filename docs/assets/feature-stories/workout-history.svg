<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Small messages. One complete training record.</title><desc id="desc">Fictional workout shorthand is accumulated into a dated record with three bench sets, calculated volume and reported duration, then retrieved for a later conversation.</desc><g font-family="Segoe UI,Arial,sans-serif"><rect width="1200" height="760" rx="22" fill="#f8f9f3"/><text x="40" y="43" font-size="14" font-weight="700" fill="#6d7c5c">MYGYMBRO / FEATURE WALKTHROUGH</text><text x="40" y="91" font-size="34" font-weight="750" fill="#23291e">Small messages. One complete training record.</text><text x="40" y="128" font-size="19" font-weight="400" fill="#425038">Log between sets, finish the session, and revisit the work next time.</text><rect x="40" y="162" width="360" height="504" rx="16" fill="#fff" stroke="#dce3d3"/><rect x="62" y="184" width="35" height="31" rx="8" fill="#d0f879" stroke="#d0f879"/><text x="72" y="206" font-size="17" font-weight="700" fill="#425038">1</text><text x="110" y="207" font-size="22" font-weight="700" fill="#425038">Capture the work</text><rect x="62" y="235" width="316" height="56" rx="16" fill="#e3f4c8" stroke="#dce3d3"/><text x="78" y="266" font-size="18" font-weight="400" fill="#425038">bench 60x12</text><rect x="62" y="321" width="316" height="56" rx="16" fill="#ffffff" stroke="#dce3d3"/><text x="78" y="352" font-size="18" font-weight="400" fill="#425038">Noted.</text><rect x="62" y="407" width="316" height="56" rx="16" fill="#e3f4c8" stroke="#dce3d3"/><text x="78" y="438" font-size="18" font-weight="400" fill="#425038">bench 60x12, 60x10</text><rect x="62" y="493" width="316" height="56" rx="16" fill="#e3f4c8" stroke="#dce3d3"/><text x="78" y="524" font-size="18" font-weight="400" fill="#425038">done, 46 minutes</text><text x="62" y="617" font-size="17" font-weight="600" fill="#425038">Shorthand → session completion</text><rect x="420" y="162" width="360" height="504" rx="16" fill="#fff" stroke="#dce3d3"/><rect x="442" y="184" width="35" height="31" rx="8" fill="#d0f879" stroke="#d0f879"/><text x="452" y="206" font-size="17" font-weight="700" fill="#425038">2</text><text x="490" y="207" font-size="22" font-weight="700" fill="#425038">Keep it together</text><rect x="442" y="235" width="316" height="345" rx="16" fill="#fff" stroke="#dce3d3"/><text x="458" y="270" font-size="14" font-weight="700" fill="#425038">NOTION / DAILY WORKOUT LOG</text><text x="458" y="308" font-size="15" font-weight="400" fill="#6d7962">Working sets</text><text x="458" y="337" font-size="21" font-weight="650" fill="#425038">60 kg × 12, 12, 10</text><text x="458" y="382" font-size="15" font-weight="400" fill="#6d7962">Bench volume</text><text x="458" y="411" font-size="21" font-weight="650" fill="#425038">2,040 kg</text><text x="458" y="456" font-size="15" font-weight="400" fill="#6d7962">Reported duration</text><text x="458" y="485" font-size="21" font-weight="650" fill="#425038">46 minutes</text><text x="458" y="550" font-size="16" font-weight="600" fill="#587836">Stored under the session’s date</text><text x="442" y="628" font-size="17" font-weight="400" fill="#425038">The numbers come from reported sets.</text><rect x="800" y="162" width="360" height="504" rx="16" fill="#fff" stroke="#dce3d3"/><rect x="822" y="184" width="35" height="31" rx="8" fill="#d0f879" stroke="#d0f879"/><text x="832" y="206" font-size="17" font-weight="700" fill="#425038">3</text><text x="870" y="207" font-size="22" font-weight="700" fill="#425038">Bring history forward</text><rect x="822" y="235" width="316" height="56" rx="16" fill="#e3f4c8" stroke="#dce3d3"/><text x="838" y="266" font-size="18" font-weight="400" fill="#425038">What did I bench last time?</text><rect x="822" y="322" width="316" height="84" rx="16" fill="#ffffff" stroke="#dce3d3"/><text x="838" y="353" font-size="18" font-weight="400" fill="#425038">Your sample record has</text><text x="838" y="381" font-size="18" font-weight="400" fill="#425038">60 kg × 12, 12, and 10.</text><rect x="822" y="459" width="316" height="105" rx="16" fill="#f1f5e9" stroke="#dce3d3"/><text x="838" y="493" font-size="17" font-weight="400" fill="#425038">History gives planning a reference.</text><text x="838" y="519" font-size="17" font-weight="400" fill="#425038">Share your recovery and goals</text><text x="838" y="545" font-size="17" font-weight="400" fill="#425038">before choosing the next load.</text><text x="40" y="710" font-size="13" font-weight="650" fill="#6d7c5c">SCRIPTED EXAMPLE · FICTIONAL DATA · CONNECTED NOTION REQUIRED TO SAVE RECORDS</text><text x="40" y="739" font-size="14" font-weight="400" fill="#6d7c5c">Illustrative product flow. Messages and values shown are examples, not a live integration.</text></g></svg>